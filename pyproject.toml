[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "omnidoc-ai"
version = "0.1.0"
description = "Multimodal document intelligence MVP"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27", "pydantic-settings>=2.2", "python-multipart>=0.0.9", "pypdf>=4.0", "scikit-learn>=1.4"]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]
dashboard = ["streamlit>=1.32", "requests>=2.31"]
ocr = ["Pillow>=10.0", "pytesseract>=0.3.10"]
vector = ["chromadb>=0.5", "sentence-transformers>=2.6"]
models = ["transformers>=4.44", "torch>=2.2"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
